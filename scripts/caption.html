<!doctype html>
<!-- 재생 화면 하단 문구 이미지(public/img/caption.png)의 원본. 문구를 바꾸면 Chrome으로 투명 배경 PNG를 다시 만든다:
     chrome --headless=new --hide-scrollbars --window-size=1600,300 --force-device-scale-factor=2 \
       --default-background-color=00000000 --virtual-time-budget=8000 --screenshot=caption.png caption.html -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Cinzel:wght@400;500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .cap { width: 1600px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fffaf3; }
  .names { font-family: 'Cinzel', 'Times New Roman', serif; font-weight: 500; font-size: 92px; letter-spacing: 0.16em; line-height: 1; margin-right: -0.16em; }
  .amp { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 1.12em; letter-spacing: 0; margin: 0 0.12em 0 -0.02em; color: #FDE3C7; }
  .rule { width: 520px; height: 1px; margin: 34px 0 30px; background: linear-gradient(90deg, transparent, rgba(253,227,199,.9) 20%, rgba(253,227,199,.9) 80%, transparent); }
  .date { font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-weight: 500; font-variant-numeric: lining-nums; font-size: 50px; letter-spacing: 0.32em; margin-right: -0.32em; color: rgba(255,250,243,.92); }
  .bar { color: #FDE3C7; margin: 0 0.3em; }
</style></head>
<body><div class="cap">
  <div class="names">KYUDONG <span class="amp">&amp;</span> SEOYOON</div>
  <div class="rule"></div>
  <div class="date">2026. 10. 31<span class="bar">|</span>2:00 PM</div>
</div></body></html>
