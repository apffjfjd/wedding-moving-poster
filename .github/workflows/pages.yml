# main 브랜치에 push 하면 구글 드라이브 모드 정적 사이트를 GitHub Pages에 배포한다.
# 사전 설정: 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 지정.
# Drive API 키는 pages/config.js 에 직접 넣거나, Settings > Secrets and variables > Actions > Variables 에
# DRIVE_API_KEY 를 등록하면 빌드 시 주입된다. (브라우저에 노출되는 값이므로 도메인 제한 필수)
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build-pages.mjs
        env:
          DRIVE_API_KEY: ${{ vars.DRIVE_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
